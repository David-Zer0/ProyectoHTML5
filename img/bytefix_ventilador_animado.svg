<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="320" height="320" viewBox="0 0 320 320"
     role="img" aria-labelledby="title desc">
  <title id="title">Ventilador de ordenador animado</title>
  <desc id="desc">Ventilador de ordenador con cinco aspas que giran continuamente.</desc>

  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26384d"/>
      <stop offset="1" stop-color="#101b2a"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#53e0d0"/>
      <stop offset="1" stop-color="#1687b5"/>
    </linearGradient>
    <radialGradient id="hub">
      <stop offset="0" stop-color="#f9d66b"/>
      <stop offset="1" stop-color="#e99b32"/>
    </radialGradient>
  </defs>

  <!-- Marco exterior -->
  <rect x="20" y="20" width="280" height="280" rx="42"
        fill="url(#frame)" stroke="#40566d" stroke-width="8"/>

  <!-- Tornillos -->
  <g fill="#9aabba" stroke="#172638" stroke-width="3">
    <circle cx="48" cy="48" r="9"/>
    <circle cx="272" cy="48" r="9"/>
    <circle cx="48" cy="272" r="9"/>
    <circle cx="272" cy="272" r="9"/>
  </g>
  <g stroke="#26384d" stroke-width="2.5" stroke-linecap="round">
    <path d="M43 48h10 M267 48h10 M43 272h10 M267 272h10"/>
  </g>

  <!-- Aspas giratorias -->
  <g>
    <g transform="translate(160 160)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          from="0" to="360" dur="2.2s" repeatCount="indefinite"/>
        <g fill="url(#blade)" stroke="#8af4e6" stroke-width="2">
          <path d="M0 -18 C-18 -48 -17 -101 8 -119
                   C32 -93 27 -49 12 -16
                   C8 -8 3 -7 0 -18Z"/>
          <path d="M0 -18 C-18 -48 -17 -101 8 -119
                   C32 -93 27 -49 12 -16
                   C8 -8 3 -7 0 -18Z" transform="rotate(72)"/>
          <path d="M0 -18 C-18 -48 -17 -101 8 -119
                   C32 -93 27 -49 12 -16
                   C8 -8 3 -7 0 -18Z" transform="rotate(144)"/>
          <path d="M0 -18 C-18 -48 -17 -101 8 -119
                   C32 -93 27 -49 12 -16
                   C8 -8 3 -7 0 -18Z" transform="rotate(216)"/>
          <path d="M0 -18 C-18 -48 -17 -101 8 -119
                   C32 -93 27 -49 12 -16
                   C8 -8 3 -7 0 -18Z" transform="rotate(288)"/>
        </g>
      </g>
    </g>
    <!-- Centro fijo -->
    <circle cx="160" cy="160" r="27" fill="#14283b" stroke="#6ee7dc" stroke-width="5"/>
    <circle cx="160" cy="160" r="16" fill="url(#hub)"/>
    <circle cx="155" cy="154" r="5" fill="#fff2bd" opacity=".8"/>
  </g>

  <!-- Anillo interior -->
  <circle cx="160" cy="160" r="126" fill="none"
          stroke="#6d8499" stroke-width="3" opacity=".55"/>
</svg>
